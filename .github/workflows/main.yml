name: Build Android App

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run APK functionality tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -wipe-data
          script: >-
            adb start-server; adb wait-for-device; i=0; stable=0; while [ "$i" -lt 120 ]; do device_state="$(adb get-state 2>/dev/null || true)"; boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")"; package_service="$(adb shell service check package 2>/dev/null || true)"; if [ "$device_state" = "device" ] && [ "$boot_completed" = "1" ] && echo "$package_service" | grep -q "found" && adb shell cmd package list packages >/dev/null 2>&1; then stable=$((stable + 1)); else stable=0; fi; if [ "$stable" -ge 6 ]; then break; fi; i=$((i + 1)); sleep 5; done; if [ "$device_state" != "device" ] || [ "$boot_completed" != "1" ] || [ "$stable" -lt 6 ] || ! adb shell cmd package list packages >/dev/null 2>&1; then echo "Android emulator/package service did not remain ready in time" >&2; adb get-state || true; adb shell getprop sys.boot_completed || true; adb shell service check package || true; adb shell service list || true; exit 1; fi; ./gradlew connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
